name: Auto New Product Preorder (Safe)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Safety check before any change
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('ACTIVE_preorder1.xml').getroot()
          offers = [e for e in root.iter() if e.tag.rsplit('}',1)[-1] == 'offer']
          company = next((e.text for e in root.iter() if e.tag.rsplit('}',1)[-1] == 'company'), '')
          merchant = next((e.text for e in root.iter() if e.tag.rsplit('}',1)[-1] == 'merchantid'), '')
          print(f'Company: {company}')
          print(f'Merchant: {merchant}')
          print(f'Offers: {len(offers)}')
          if company != '30457864' or merchant != '30457864' or len(offers) != 50:
              raise SystemExit('SAFETY STOP: expected exactly 50 offers for merchant 30457864')
          PY
      - name: No automatic catalog change
        run: echo "Catalog verified. Automatic changes are disabled until explicitly configured."
