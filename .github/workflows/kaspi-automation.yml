name: Kaspi Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  kaspi-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Telegram-ға басталғанын хабарлау
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🟡 DEKOS Kaspi Automation іске қосылды.\nУақыты: $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Repository алу
        uses: actions/checkout@v5

      - name: Python қосу
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Барлық тауарды 1 күндік предзаказға қою
        id: preorder
        run: |
          python set-preorder.py

      - name: Өзгерісті GitHub-қа сақтау
        run: |
          git config user.name "DEKOS Kaspi Automation"
          git config user.email "automation@github.com"

          git add ACTIVE_preorder1.xml

          if git diff --cached --quiet; then
            echo "Өзгеріс жоқ"
          else
            git commit -m "Auto: барлық тауар 1 күндік предзаказ"
            git push
          fi

      - name: Telegram-ға сәтті аяқталғанын хабарлау
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOTAL: ${{ steps.preorder.outputs.total }}
          UPDATED: ${{ steps.preorder.outputs.updated }}
          ALREADY_PREORDER: ${{ steps.preorder.outputs.already_preorder }}
          SKIPPED: ${{ steps.preorder.outputs.skipped }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🟢 DEKOS Kaspi Automation сәтті аяқталды.\n\n📦 Жалпы тексерілген тауар: ${TOTAL}\n🔄 Стоктан предзаказға өзгертілген тауар: ${UPDATED}\n📋 Бұрыннан предзаказдағы тауар: ${ALREADY_PREORDER}\n⚠️ Availability жоқ тауар: ${SKIPPED}\n\n⏱ Уақыты: $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Telegram-ға қате туралы хабарлау
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔴 DEKOS Kaspi Automation қатемен тоқтады. GitHub Actions журналын тексеру керек.\nУақыты: $(date -u '+%Y-%m-%d %H:%M UTC')"