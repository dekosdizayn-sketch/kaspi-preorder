name: Kaspi Automation

on:
  workflow_dispatch:

  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  kaspi-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Repository алу
        uses: actions/checkout@v5

      - name: Python қосу
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Барлық тауарды 1 күндік предзаказға қою
        run: |
          python set-preorder.py

      - name: Өзгерісті GitHub-қа сақтау
        run: |
          git config user.name "DEKOS Kaspi Automation"
          git config user.email "automation@github.com"

          git add ACTIVE_preorder1.xml

          if git diff --cached --quiet; then
            echo "Өзгеріс жоқ"
          else
            git commit -m "Auto: барлық тауар 1 күндік предзаказ"
            git push
          fi
