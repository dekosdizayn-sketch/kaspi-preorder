name: Kaspi Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  kaspi-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Дәл 50 тауарды тексеру және 2 күндік предзаказ
        id: preorder
        continue-on-error: true
        run: python set-preorder.py

      - name: GitHub-қа тек дұрыс өзгерісті сақтау
        if: steps.preorder.outcome == 'success'
        run: |
          git config user.name "DEKOS Kaspi Automation"
          git config user.email "automation@github.com"
          git add ACTIVE_preorder1.xml
          if ! git diff --cached --quiet; then
            git commit -m "Auto: verified 50-product catalog set to 2-day preorder"
            git push
          fi

      - name: Telegram-ға нәтиже жіберу
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPANY: ${{ steps.preorder.outputs.company }}
          MERCHANT: ${{ steps.preorder.outputs.merchant }}
          TOTAL: ${{ steps.preorder.outputs.total }}
          UPDATED: ${{ steps.preorder.outputs.updated }}
          ALREADY: ${{ steps.preorder.outputs.already_preorder }}
          SKIPPED: ${{ steps.preorder.outputs.skipped }}
          OUTCOME: ${{ steps.preorder.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            TEXT="🟢 DEKOS Kaspi Automation аяқталды

🏪 Company: ${COMPANY}
🏬 Merchant: ${MERCHANT}
📦 Нақты бірегей тауар: ${TOTAL}
🔄 2 күндік предзаказға өзгертілді: ${UPDATED}
📋 Бұрыннан 2 күндік предзаказ: ${ALREADY}
⚠️ Availability жоқ: ${SKIPPED}"
          else
            TEXT="🔴 Автоматизация ҚАУІПСІЗДІК ҮШІН ТОҚТАТЫЛДЫ

Күтілген каталог сәйкес емес.
📦 Табылған тауар: ${TOTAL}
🏪 Company: ${COMPANY}
🏬 Merchant: ${MERCHANT}

Тек Company 30457864, Merchant 30457864 және дәл 50 тауар болғанда ғана XML өзгереді."
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

      - name: Жарамсыз каталог болса workflow-ды қате аяқтау
        if: steps.preorder.outcome != 'success'
        run: exit 1
