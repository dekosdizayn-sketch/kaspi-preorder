name: Kaspi to Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  check-orders:
    runs-on: ubuntu-latest

    steps:
      - name: Check Kaspi orders
        env:
          KASPI_TOKEN: ${{ secrets.KASPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          URL="https://kaspi.kz/shop/api/v2/orders"

          RESPONSE=$(curl -fsS \
            -H "Content-Type: application/vnd.api+json" \
            -H "X-Auth-Token: ${KASPI_TOKEN}" \
            "${URL}")

          echo "$RESPONSE" > /tmp/kaspi.json

          COUNT=$(echo "$RESPONSE" | jq '.data | length')

          echo "Kaspi orders found: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No orders."
            exit 0
          fi

          MESSAGE="🛍 НОВЫЕ ЗАКАЗЫ KASPI%0A%0A"

          while IFS= read -r ORDER; do
            CODE=$(echo "$ORDER" | jq -r '.attributes.code // "-"')
            STATUS=$(echo "$ORDER" | jq -r '.attributes.status // "-"')

            MESSAGE="${MESSAGE}📦 Заказ: ${CODE}%0A"
            MESSAGE="${MESSAGE}📌 Статус: ${STATUS}%0A%0A"
          done < <(echo "$RESPONSE" | jq -c '.data[]')

          curl -fsS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(printf '%b' "${MESSAGE}")"

          echo "Telegram notification sent."