name: Kaspi Network Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnose Kaspi connection
        env:
          KASPI_TOKEN_NEW: ${{ secrets.KASPI_TOKEN_NEW }}
        run: |
          set -u

          echo "=== KASPI NETWORK / API DIAGNOSTIC ==="

          echo "1. GitHub internet test..."
          curl -4 --connect-timeout 10 --max-time 15 \
            -sS -o /dev/null \
            -w "GITHUB HTTP:%{http_code} TIME:%{time_total}\n" \
            https://api.github.com || true

          echo "2. Kaspi DNS..."
          getent ahostsv4 kaspi.kz || true

          echo "3. Kaspi HTTPS..."
          curl -4 --http1.1 \
            --connect-timeout 10 \
            --max-time 20 \
            -sS -o /dev/null \
            -w "KASPI HTTP:%{http_code} TIME:%{time_total}\n" \
            https://kaspi.kz/ 2>&1 || true

          echo "4. Kaspi Guide..."
          curl -4 --http1.1 \
            --connect-timeout 10 \
            --max-time 20 \
            -sS -o /dev/null \
            -w "GUIDE HTTP:%{http_code} TIME:%{time_total}\n" \
            https://guide.kaspi.kz/ 2>&1 || true

          echo "5. Kaspi API schema WITH token..."

          if [ -z "${KASPI_TOKEN_NEW:-}" ]; then
            echo "ERROR: KASPI_TOKEN_NEW is missing"
            exit 1
          fi

          curl -4 --http1.1 \
            --connect-timeout 10 \
            --max-time 30 \
            -sS \
            -w "SCHEMA HTTP:%{http_code} TIME:%{time_total} SIZE:%{size_download}\n" \
            -H "Accept: application/json" \
            -H "X-Auth-Token: ${KASPI_TOKEN_NEW}" \
            "https://kaspi.kz/shop/api/products/import/schema" \
            2>&1 || true

          echo "=== DIAGNOSTIC FINISHED ==="
