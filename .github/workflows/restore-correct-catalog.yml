name: Restore Correct 50-Product Catalog

on:
  push:
    paths:
      - '.github/workflows/restore-correct-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore exact verified 50-product XML
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          data = ''
          pathlib.Path('ACTIVE_preorder1.xml').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
      - name: Validate exact store catalog
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('ACTIVE_preorder1.xml').getroot()
          offers=[e for e in root.iter() if e.tag.rsplit('}',1)[-1]=='offer']
          company=next(e.text for e in root.iter() if e.tag.rsplit('}',1)[-1]=='company')
          merchant=next(e.text for e in root.iter() if e.tag.rsplit('}',1)[-1]=='merchantid')
          assert company=='30457864', company
          assert merchant=='30457864', merchant
          assert len(offers)==50, len(offers)
          print('VALID: 50 offers, company/merchant 30457864')
          PY
      - name: Commit restored catalog
        run: |
          git config user.name 'DEKOS Kaspi Repair'
          git config user.email 'automation@github.com'
          git add ACTIVE_preorder1.xml
          git commit -m 'Restore exact verified 50-product catalog'
          git push
